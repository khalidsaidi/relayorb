name: Question
description: Ask for clarification about usage or architecture
title: "[Question]: "
labels:
  - question
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to achieve?
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Ask the specific question
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What you have tried
      description: Include commands, snippets, or references (redact secrets)
