name: Deploy Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/relayorb-registry/**"
      - "crates/relayorb-core/**"
      - "crates/relayorb-worker-sdk/**"
      - "crates/relayorb-samples/worker-mock-rag/**"
      - "config/registry-ownership.toml"
      - "infra/gcp/terraform/**"
      - "ops/smoke/registry-governance-smoke.sh"
      - "ops/smoke/network-posture-smoke.sh"
      - "ops/smoke/metrics-auth-smoke.sh"
      - "ops/smoke/metrics-scraper-smoke.sh"
      - ".github/workflows/deploy-registry.yml"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: relayorb-prod
  REGION: us-central1
  REPOSITORY: relayorb
  SERVICE_NAME: relayorb-registry-prod
  OWNER_SERVICE_NAME: relayorb-rag-prod
  GATEWAY_SERVICE_NAME: relayorb-gateway-prod
  SCRAPER_SERVICE_NAME: relayorb-metrics-scraper-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_REGISTRY_DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -f crates/relayorb-registry/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        run: |
          REGISTRY_URL="$(gcloud run services describe "${{ env.SERVICE_NAME }}" --project "${{ env.PROJECT_ID }}" --region "${{ env.REGION }}" --format='value(status.url)')"
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --image "$IMAGE" \
            --service-account relayorb-registry-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --ingress all \
            --invoker-iam-check \
            --set-env-vars RELAYORB_ENV=prod,RELAYORB_REGION=${{ env.REGION }},RELAYORB_SERVICE_NAME=${{ env.SERVICE_NAME }},RELAYORB_VERSION=${{ github.sha }},REGISTRY_BIND_ADDR=0.0.0.0:8080,REGISTRY_OWNERSHIP_POLICY_PATH=config/registry-ownership.toml,REGISTRY_WORKER_AUTH_MODE=oidc,REGISTRY_WORKER_OIDC_ISSUER=https://accounts.google.com,REGISTRY_WORKER_OIDC_AUDIENCE=$REGISTRY_URL,REGISTRY_WORKER_JWKS_URL=https://www.googleapis.com/oauth2/v3/certs,METRICS_AUTH_MODE=bearer \
            --set-secrets DATABASE_URL=relayorb-prod-registry-db:latest,METRICS_BEARER_TOKEN=relayorb-prod-registry-metrics-token:latest

      - name: Warm Registry Cache (best effort)
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY_URL="$(gcloud run services describe "${{ env.SERVICE_NAME }}" --project "${{ env.PROJECT_ID }}" --region "${{ env.REGION }}" --format='value(status.url)')"
          TOKEN="$(gcloud auth print-identity-token --impersonate-service-account "${{ secrets.GCP_REGISTRY_DEPLOYER_SA }}" --audiences "$REGISTRY_URL")"
          for _ in $(seq 1 24); do
            RESPONSE="$(curl -sS -H "Authorization: Bearer $TOKEN" "$REGISTRY_URL/v1/capabilities/rag.search@v1" || true)"
            if echo "$RESPONSE" | jq -e --arg service_name "${{ env.OWNER_SERVICE_NAME }}" '.providers // [] | any((.serviceName == $service_name or .service_name == $service_name) and (.healthy // false) == true)' >/dev/null; then
              echo "owner worker is registered and healthy"
              exit 0
            fi
            sleep 5
          done
          echo "owner worker was not yet visible in registry; continuing to downstream smoke checks"
          echo "$RESPONSE" | head -c 1000

      - name: Verify runtime service accounts
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY_SA="$(gcloud run services describe "${{ env.SERVICE_NAME }}" --project "${{ env.PROJECT_ID }}" --region "${{ env.REGION }}" --format='value(spec.template.spec.serviceAccountName)')"
          WORKER_SA="$(gcloud run services describe "${{ env.OWNER_SERVICE_NAME }}" --project "${{ env.PROJECT_ID }}" --region "${{ env.REGION }}" --format='value(spec.template.spec.serviceAccountName)')"
          [ "$REGISTRY_SA" = "relayorb-registry-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" ]
          [ "$WORKER_SA" = "relayorb-rag-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" ]

      - name: Verify no public invoker on private services
        shell: bash
        run: |
          set -euo pipefail
          for SERVICE in "${{ env.SERVICE_NAME }}" "${{ env.OWNER_SERVICE_NAME }}"; do
            POLICY_JSON="$(gcloud run services get-iam-policy "$SERVICE" --project "${{ env.PROJECT_ID }}" --region "${{ env.REGION }}" --format=json)"
            HAS_ALL_USERS="$(echo "$POLICY_JSON" | jq -r '[.bindings[]? | select(.role=="roles/run.invoker") | .members[]? | select(.=="allUsers")] | length')"
            if [ "$HAS_ALL_USERS" != "0" ]; then
              echo "service $SERVICE still has allUsers run.invoker"
              echo "$POLICY_JSON"
              exit 1
            fi
          done

      - name: Registry Metrics Auth Smoke (private service)
        shell: bash
        run: |
          set -euo pipefail
          export ALLOW_IAM_FORBIDDEN=1
          REGISTRY_URL="$(gcloud run services describe "${{ env.SERVICE_NAME }}" --project "${{ env.PROJECT_ID }}" --region "${{ env.REGION }}" --format='value(status.url)')"
          METRICS_TOKEN="$(gcloud secrets versions access latest --project "${{ env.PROJECT_ID }}" --secret relayorb-prod-registry-metrics-token)"
          bash ops/smoke/metrics-auth-smoke.sh "$REGISTRY_URL" "$METRICS_TOKEN"

      - name: Worker Metrics Auth Smoke (private service)
        shell: bash
        run: |
          set -euo pipefail
          export ALLOW_IAM_FORBIDDEN=1
          WORKER_URL="$(gcloud run services describe "${{ env.OWNER_SERVICE_NAME }}" --project "${{ env.PROJECT_ID }}" --region "${{ env.REGION }}" --format='value(status.url)')"
          WORKER_METRICS_TOKEN="$(gcloud secrets versions access latest --project "${{ env.PROJECT_ID }}" --secret relayorb-prod-worker-metrics-token)"
          bash ops/smoke/metrics-auth-smoke.sh "$WORKER_URL" "$WORKER_METRICS_TOKEN"

      - name: Governance Smoke (post-deploy)
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY_URL="$(gcloud run services describe "${{ env.SERVICE_NAME }}" --project "${{ env.PROJECT_ID }}" --region "${{ env.REGION }}" --format='value(status.url)')"
          export REGISTRY_SMOKE_BEARER_TOKEN="$(gcloud auth print-identity-token --impersonate-service-account "${{ secrets.GCP_REGISTRY_DEPLOYER_SA }}" --audiences "$REGISTRY_URL")"
          echo "Running governance smoke: $REGISTRY_URL"
          bash ops/smoke/registry-governance-smoke.sh "$REGISTRY_URL"

      - name: Network Posture Smoke (private registry/worker + gateway e2e)
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY_URL="$(gcloud run services describe "${{ env.SERVICE_NAME }}" --project "${{ env.PROJECT_ID }}" --region "${{ env.REGION }}" --format='value(status.url)')"
          WORKER_URL="$(gcloud run services describe "${{ env.OWNER_SERVICE_NAME }}" --project "${{ env.PROJECT_ID }}" --region "${{ env.REGION }}" --format='value(status.url)')"
          GATEWAY_URL="$(gcloud run services describe "${{ env.GATEWAY_SERVICE_NAME }}" --project "${{ env.PROJECT_ID }}" --region "${{ env.REGION }}" --format='value(status.url)')"
          GATEWAY_TOKEN="$(gcloud auth print-identity-token --impersonate-service-account "${{ secrets.GCP_REGISTRY_DEPLOYER_SA }}" --audiences "${{ secrets.RELAYORB_PROD_OIDC_AUDIENCE }}")"
          bash ops/smoke/network-posture-smoke.sh "$GATEWAY_URL" "$REGISTRY_URL" "$WORKER_URL" "$GATEWAY_TOKEN"

      - name: Metrics Scraper Smoke (post-hardening)
        shell: bash
        run: |
          set -euo pipefail
          bash ops/smoke/metrics-scraper-smoke.sh "${{ env.PROJECT_ID }}" "${{ env.REGION }}" "${{ env.SCRAPER_SERVICE_NAME }}" "${{ env.GATEWAY_SERVICE_NAME }}" "${{ env.SERVICE_NAME }}" "${{ env.OWNER_SERVICE_NAME }}"
