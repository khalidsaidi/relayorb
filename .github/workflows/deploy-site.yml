name: Deploy RelayOrb Site to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: relayorb-prod
          workload_identity_provider: ${{ secrets.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.32.1

      - name: Install site dependencies
        run: pnpm --dir site install --frozen-lockfile

      - name: Build static site
        run: pnpm --dir site build

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project relayorb-prod --non-interactive
