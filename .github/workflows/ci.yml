name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Conformance (offline validate all manifests)
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST_DIR="conformance/manifests"
          VECTOR_DIR="conformance/vectors"

          shopt -s nullglob
          manifests=("$MANIFEST_DIR"/*.json)

          if [ ${#manifests[@]} -eq 0 ]; then
            echo "No manifests found in $MANIFEST_DIR"
            exit 2
          fi

          for manifest in "${manifests[@]}"; do
            base="$(basename "$manifest" .json)"
            vectors="$VECTOR_DIR/$base.json"

            if [ ! -f "$vectors" ]; then
              echo "Missing vectors for manifest: $manifest"
              echo "Expected: $vectors"
              exit 2
            fi

            echo "Validating $base"
            cargo run -p relayorb-conformance -- validate --manifest "$manifest" --vectors "$vectors"
          done

      - name: Build Release
        run: cargo build --workspace --release
