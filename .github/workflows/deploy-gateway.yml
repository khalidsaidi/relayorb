name: Deploy Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/relayorb-gateway/**"
      - "crates/relayorb-core/**"
      - "crates/relayorb-policy/**"
      - ".github/workflows/deploy-gateway.yml"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: relayorb-prod
  REGION: us-central1
  REPOSITORY: relayorb
  SERVICE_NAME: relayorb-gateway

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_GATEWAY_DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -f crates/relayorb-gateway/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --image "$IMAGE" \
            --service-account relayorb-gateway-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --set-env-vars RELAYORB_ENV=prod,REGISTRY_URL=https://relayorb-registry-PLACEHOLDER.run.app,POLICY_PATH=config/policy.toml \
            --set-secrets SECRET_AUTH_HMAC=relayorb-auth-hmac:latest,DATABASE_URL=database-url:latest,JWT_PUBLIC_KEYS_URL=relayorb-jwt-public-keys-url:latest
