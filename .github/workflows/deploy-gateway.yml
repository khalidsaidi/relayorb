name: Deploy Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/relayorb-gateway/**"
      - "crates/relayorb-core/**"
      - "crates/relayorb-policy/**"
      - ".github/workflows/deploy-gateway.yml"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: relayorb-prod
  REGION: us-central1
  REPOSITORY: relayorb
  SERVICE_NAME: relayorb-gateway-prod
  REGISTRY_SERVICE_NAME: relayorb-registry-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_GATEWAY_DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -f crates/relayorb-gateway/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        run: |
          REGISTRY_URL="$(gcloud run services describe "${{ env.REGISTRY_SERVICE_NAME }}" --project "${{ env.PROJECT_ID }}" --region "${{ env.REGION }}" --format='value(status.url)')"
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --image "$IMAGE" \
            --service-account relayorb-gateway-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --set-env-vars RELAYORB_ENV=prod,RELAYORB_SERVICE_NAME=${{ env.SERVICE_NAME }},REGISTRY_URL=${REGISTRY_URL},POLICY_PATH=config/policy.toml,AUTH_MODE=oidc,OIDC_ISSUER=${{ secrets.RELAYORB_PROD_OIDC_ISSUER }},OIDC_AUDIENCE=${{ secrets.RELAYORB_PROD_OIDC_AUDIENCE }},JWKS_URL=${{ secrets.RELAYORB_PROD_JWKS_URL }},AUTH_CLOCK_SKEW_SECONDS=120 \
            --set-secrets DATABASE_URL=relayorb-prod-gateway-db:latest
