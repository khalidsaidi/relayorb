services:
  registry:
    build:
      context: ..
      dockerfile: crates/relayorb-registry/Dockerfile
    environment:
      RELAYORB_ENV: dev
      RELAYORB_SERVICE_NAME: relayorb-registry-dev
      REGISTRY_BIND_ADDR: 0.0.0.0:8081
      DATABASE_URL: sqlite:///data/registry.db?mode=rwc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      RELAYORB_METRICS_EXPORTER: prometheus
    ports:
      - "8081:8081"
    volumes:
      - registry-data:/data
    depends_on:
      - otel-collector

  gateway:
    build:
      context: ..
      dockerfile: crates/relayorb-gateway/Dockerfile
    environment:
      RELAYORB_ENV: dev
      RELAYORB_SERVICE_NAME: relayorb-gateway-dev
      GATEWAY_BIND_ADDR: 0.0.0.0:8080
      REGISTRY_URL: http://registry:8081
      DATABASE_URL: sqlite:///data/gateway.db?mode=rwc
      AUTH_MODE: hmac
      SECRET_AUTH_HMAC: relayorb-dev-secret
      POLICY_PATH: config/policy.toml
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      RELAYORB_METRICS_EXPORTER: prometheus
    ports:
      - "8080:8080"
    volumes:
      - gateway-data:/data
    depends_on:
      - registry
      - otel-collector

  worker:
    build:
      context: ..
      dockerfile: crates/relayorb-samples/worker-mock-rag/Dockerfile
    environment:
      RELAYORB_ENV: dev
      RELAYORB_SERVICE_NAME: relayorb-rag-dev
      REGISTRY_URL: http://registry:8081
      WORKER_BIND_ADDR: 0.0.0.0:8090
      WORKER_BASE_URL: http://worker:8090
      RELAYORB_PUBLIC_BASE_URL: http://worker:8090
      WORKER_INSTANCE_ID: worker-mock-rag-1
      RELAYORB_REGION: us-central1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      RELAYORB_METRICS_EXPORTER: prometheus
    ports:
      - "8090:8090"
    depends_on:
      - registry

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: relayorb
      POSTGRES_PASSWORD: relayorb
      POSTGRES_DB: relayorb
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector:0.109.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  registry-data:
  gateway-data:
  pg-data:
