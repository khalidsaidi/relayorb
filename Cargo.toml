[workspace]
members = [
  "crates/relayorb-core",
  "crates/relayorb-policy",
  "crates/relayorb-registry",
  "crates/relayorb-gateway",
  "crates/relayorb-worker-sdk",
  "crates/relayorb-samples/worker-mock-rag",
  "crates/relayorb-samples/agent-client",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["RelayOrb"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
clap = { version = "4.5", features = ["derive"] }
config = "0.14"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1.1"
jsonschema = "0.20"
jsonwebtoken = "9.3"
once_cell = "1.20"
opentelemetry = { version = "0.24", features = ["trace"] }
opentelemetry-otlp = { version = "0.17", features = ["grpc-tonic"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "migrate", "macros", "time", "uuid", "json"] }
thiserror = "1.0"
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
tokio = { version = "1.44", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.25"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
