services:
  relayorb-agent:
    image: gcr.io/relayorb/relayorb-agent:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/service-account.json
      - RELAYORB_CONFIG_PATH=/config/config.json
      - NODE_ENV=production
      - RELAYORB_FREQTRADE_CONFIG=/relayorb/freqtrade/user_data/config.json
    volumes:
      - ./agent-config/config.json:/config/config.json:ro
      - ./secrets/service-account.json:/secrets/service-account.json:ro
      - ./freqtrade/user_data:/relayorb/freqtrade/user_data
    depends_on:
      - freqtrade
      - backtrader

  relayorb-updater:
    image: gcr.io/relayorb/relayorb-agent-updater:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/service-account.json
      - RELAYORB_CONFIG_PATH=/config/config.json
      - RELAYORB_COMPOSE_PATH=/host/docker-compose.yml
      - RELAYORB_COMPOSE_PROJECT=relayorb
      - RELAYORB_AGENT_SERVICE=relayorb-agent
    volumes:
      - ./agent-config/config.json:/config/config.json:ro
      - ./secrets/service-account.json:/secrets/service-account.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/host:ro
    depends_on:
      - relayorb-agent

  freqtrade:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    volumes:
      - ./freqtrade/user_data:/freqtrade/user_data
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy SampleStrategy

  backtrader:
    build: ./backtrader
    restart: unless-stopped
    environment:
      - PORT=8080
      - FMP_API_KEY=${FMP_API_KEY:-}
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY:-}
      - POLYGON_API_KEY=${POLYGON_API_KEY:-}
    volumes:
      - ./backtrader/data:/app/data

volumes: {}
