receivers:
  prometheus:
    config:
      global:
        scrape_interval: 30s
        scrape_timeout: 10s
      scrape_configs:
        - job_name: relayorb-gateway-prod
          scheme: https
          metrics_path: /metrics
          authorization:
            type: Bearer
            credentials: ${env:GATEWAY_METRICS_TOKEN}
          static_configs:
            - targets: ["${env:GATEWAY_METRICS_TARGET}"]
              labels:
                relayorb_component: gateway
        - job_name: relayorb-registry-prod
          scheme: https
          metrics_path: /metrics
          authorization:
            type: Bearer
            credentials: ${env:REGISTRY_METRICS_TOKEN}
          static_configs:
            - targets: ["${env:REGISTRY_METRICS_TARGET}"]
              labels:
                relayorb_component: registry

processors:
  resource:
    attributes:
      - action: upsert
        key: location
        value: ${env:GCP_REGION}
      - action: upsert
        key: cluster
        value: relayorb-cloudrun
      - action: upsert
        key: namespace
        value: relayorb-prod
  batch:

exporters:
  googlemanagedprometheus:
    project: ${env:GCP_PROJECT}

extensions:
  health_check:
    endpoint: 0.0.0.0:${env:PORT}

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [resource, batch]
      exporters: [googlemanagedprometheus]
